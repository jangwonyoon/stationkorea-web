# main에 머지되면 Vercel production 배포가 반영되기를 기다렸다가 바뀐 URL을 IndexNow로 알린다(CLAUDE.md SEO·GEO 규칙 16).
# Vercel이 이 레포에 GitHub Deployments를 만들지 않아 deployment_status 대신 push + /version.txt 대조로 배포 반영을 확인한다.
name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: "sitemap의 모든 URL 전송"
        type: boolean
        default: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: production 배포 반영 대기
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 60); do
            live=$(curl -fsS https://www.stationkorea.com/version.txt || true)
            [ "$live" = "$GITHUB_SHA" ] && echo "배포 반영됨: $live" && exit 0
            sleep 15
          done
          echo "15분 안에 배포가 반영되지 않았습니다(live=$live)" && exit 1
      - run: node scripts/indexnow.mjs ${{ inputs.all && '--all' || '--days 7' }}
